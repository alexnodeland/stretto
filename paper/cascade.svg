<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 368" width="420" height="368" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
<style>svg{--bg:#fcfcfb;--ink:#0b0b0b;--muted:#52514e;--grid:#e4e3df;--a:#2a78d6;--b:#eb6834;--c:#1baf7a;--pa:#dbe8f9;--pb:#fde6da;--panel:#f1f0ec;--g1:#a3a29c;--g2:#d6d5cf;}@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ffffff;--muted:#c3c2b7;--grid:#3a3936;--a:#3987e5;--b:#d95926;--c:#199e70;--pa:#22385a;--pb:#4a2a1b;--panel:#262624;--g1:#76756f;--g2:#4b4a46;}}.t{fill:var(--ink)}.m{fill:var(--muted)}.k{fill:var(--bg)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<rect width="420" height="368" fill="var(--bg)"/>
<rect x="90.0" y="4" width="240" height="26" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3"/>
<text class="t" x="210.0" y="21.5" text-anchor="middle" font-size="12">40 held-out solo telecom tickets</text>
<line x1="210.0" y1="30" x2="210.0" y2="46" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70.0" y="47" width="280" height="40" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3"/>
<text class="t" x="210.0" y="64.0" text-anchor="middle" font-size="12" font-weight="700">compiled procedure, no model</text>
<text class="m" x="210.0" y="79.0" text-anchor="middle" font-size="10.5">trees, bindings and a guard, from traces</text>
<line x1="210.0" y1="87" x2="210.0" y2="103" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70.0" y="104" width="280" height="40" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3"/>
<text class="t" x="210.0" y="121.0" text-anchor="middle" font-size="12" font-weight="700">check the ticket's stated outcome</text>
<text class="m" x="210.0" y="136.0" text-anchor="middle" font-size="10.5">one read</text>
<line x1="210.0" y1="144" x2="70" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="4" y="167" width="132" height="40" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3"/>
<text class="t" x="70.0" y="184.0" text-anchor="middle" font-size="12" font-weight="700">resolved 25</text>
<text class="m" x="70.0" y="199.0" text-anchor="middle" font-size="10.5">one failure missed</text>
<line x1="210.0" y1="144" x2="210" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="144" y="167" width="132" height="40" rx="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3"/>
<text class="t" x="210.0" y="184.0" text-anchor="middle" font-size="12" font-weight="700">transferred 11</text>
<text class="m" x="210.0" y="199.0" text-anchor="middle" font-size="10.5">to a person, by policy</text>
<line x1="210.0" y1="144" x2="350" y2="166" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="284" y="167" width="132" height="40" rx="6" fill="var(--pb)" stroke="var(--b)" stroke-width="1.3"/>
<text class="t" x="350.0" y="184.0" text-anchor="middle" font-size="12" font-weight="700">handed back 4</text>
<text class="m" x="350.0" y="199.0" text-anchor="middle" font-size="10.5">all four failures</text>
<line x1="350" y1="207" x2="350" y2="223" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="170" y="224" width="246" height="40" rx="6" fill="var(--pb)" stroke="var(--b)" stroke-width="1.3"/>
<text class="t" x="293.0" y="241.0" text-anchor="middle" font-size="12" font-weight="700">GLM-5.3 takes over</text>
<text class="m" x="293.0" y="256.0" text-anchor="middle" font-size="10.5">with the procedure's calls and results</text>
<text class="m" x="166.0" y="238.0" text-anchor="end" font-size="10.5">resolves all 4 in both trials,</text>
<text class="m" x="166.0" y="251.0" text-anchor="end" font-size="10.5">4.75 LLM turns each</text>
<line x1="0" x2="420" y1="280" y2="280" stroke="var(--grid)"/>
<text class="t" x="2.0" y="298.0" font-size="12.5" font-weight="700">39 of 40 passed</text>
<text class="m" x="108.0" y="298.0" font-size="11.5">LLM turns per ticket:</text>
<text class="t" x="162.0" y="321.0" text-anchor="end" font-size="11.5">the cascade</text>
<rect x="170" y="310" width="6.0" height="14" rx="2" fill="var(--b)"/>
<text class="t" x="182.0" y="321.5" font-size="11.5" font-weight="700">0.48</text>
<text class="t" x="162.0" y="345.0" text-anchor="end" font-size="11.5">GLM-5.3 alone, 8 tickets</text>
<rect x="170" y="334" width="198.8" height="14" rx="2" fill="var(--g1)"/>
<text class="t" x="374.8" y="345.5" font-size="11.5" font-weight="700">15.9</text>
</svg>
