<text class="t" x="240.0" y="213.0" font-weight="700">2 LLM turns</text>
<path d="M414.2,94 C480.2,94 512.0,119 484.0,119" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
