<rect x="540" y="188" width="192.0" height="14" rx="2" fill="var(--a)"/>
<rect x="540" y="188" width="300" height="14" rx="2" fill="none" stroke="var(--grid)"/>
<text class="k" x="727.0" y="199.0" text-anchor="end" font-size="11" font-weight="700">0.64</text>
