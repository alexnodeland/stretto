<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 262" width="878" height="262" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
<style>svg{--bg:#fcfcfb;--ink:#0b0b0b;--muted:#52514e;--grid:#e4e3df;--a:#2a78d6;--b:#eb6834;--c:#1baf7a;--pa:#dbe8f9;--pb:#fde6da;--panel:#f1f0ec;--g1:#a3a29c;--g2:#d6d5cf;}@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ffffff;--muted:#c3c2b7;--grid:#3a3936;--a:#3987e5;--b:#d95926;--c:#199e70;--pa:#22385a;--pb:#4a2a1b;--panel:#262624;--g1:#76756f;--g2:#4b4a46;}}.t{fill:var(--ink)}.m{fill:var(--muted)}.k{fill:var(--bg)}</style>
