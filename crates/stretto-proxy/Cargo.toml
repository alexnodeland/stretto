[package]
name = "stretto-proxy"
description = "An MCP proxy, over stdio or Streamable HTTP, that records sessions as stretto episodes, and can serve flows, guards and a commit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://github.com/alexnodeland/stretto/blob/main/docs/cli.md#stretto-proxy"
readme = "README.md"
keywords = ["mcp", "proxy", "llm", "agents", "speculation"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[[bin]]
name = "stretto-proxy"
path = "src/main.rs"

# A tiny MCP server for trying the proxy (and for its tests).
[[bin]]
name = "stretto-mcp-demo"
path = "src/bin/stretto-mcp-demo/main.rs"

# Runs a compiled procedure against an MCP server, with no model.
[[bin]]
name = "stretto-procedure"
path = "src/bin/stretto-procedure/main.rs"

[dependencies]
anyhow.workspace = true
# Serving hosts over Streamable HTTP (`--listen`), as stretto-console serves its UI.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
fugue.workspace = true
futures-util = { version = "0.3", default-features = false }
rand.workspace = true
stretto-model.workspace = true
serde.workspace = true
# `raw_value`: a host's message is forwarded as it was sent, not re-serialized.
serde_json = { workspace = true, features = ["raw_value"] }
stretto-oracle.workspace = true
stretto-report.workspace = true
stretto-trace.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
