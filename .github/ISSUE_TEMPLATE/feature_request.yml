name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where stretto gets in the way or falls short
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change you have in mind, and how you would know it works (a test, a replay, a live run)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, and workarounds you use today
