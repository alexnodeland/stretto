name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p stretto-console --all-targets --features ts -- -D warnings
      - run: cargo test --all-targets
      # --all-targets leaves out doctests.
      - run: cargo test --doc
      # The API's TypeScript (console/src/api/generated/), which the console's
      # ts feature writes: fails when the committed files were out of date.
      - run: cargo test -p stretto-console --features ts --lib api::typescript
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest Rust the workspace claims (rust-version in Cargo.toml), with the
  # committed lockfile, so a dependency that needs a newer rustc fails here.
  # Bump the toolchain below and rust-version together.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: rust-version in Cargo.toml is the toolchain this job pins
        run: grep -qx 'rust-version = "1.88"' Cargo.toml
      # +1.88.0: rust-toolchain.toml would otherwise select stable.
      - run: cargo +1.88.0 check --workspace --all-targets --locked

  # docs/walkthrough.md, run end to end on the official MCP filesystem server,
  # and the proxy in front of the reference Streamable HTTP server.
  walkthrough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p stretto-report -p stretto-proxy
      # examples/quickstart: the loop on stretto-mcp-demo, with no key and no network.
      - run: sh examples/quickstart/run.sh --bin target/debug
      # install.sh against a local release of stand-in binaries, and the shell scripts linted.
      - run: sh packaging/test-install.sh
      - run: shellcheck install.sh examples/quickstart/run.sh packaging/test-install.sh packaging/homebrew/fill.sh crates/stretto-console/tests/fixtures/regenerate.sh
      - run: python3 scripts/walkthrough.py --bin target/debug
      - run: python3 scripts/http_check.py --bin target/debug
      # The compiled workflow's binding rules (scripts/telecom_workflow.py), which need no τ²-bench.
      - run: python3 -m doctest scripts/telecom_workflow.py
      # The spans of the user's words a model picks from (scripts/ceiling.py's fifth count).
      - run: python3 -m doctest scripts/ceiling.py
      # The benchmarks round's scripts (scripts/bench/), on a fixture of two replays and a ceiling.
      - run: bash -n scripts/bench/replay.sh
      - run: |
          python3 scripts/bench/tables.py --work scripts/bench/fixture --json /tmp/rows.json
          python3 -c "import json; c = json.load(open('/tmp/rows.json'))['dtap_by_source']['all|own']; assert (c['reach_saved'], c['habit_saved'], c['reach_detours']) == (31, 17, 2), c"

  # The release builds for macOS and Windows, which the jobs above do not run:
  # each binary is built as release.yml builds it, and answers --version.
  platforms:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p stretto-report -p stretto-proxy -p stretto-console
      - shell: bash
        run: |
          for bin in stretto stretto-proxy stretto-procedure stretto-mcp-demo stretto-console; do
            "target/debug/$bin" --version
          done
      # The console's own tests, on a platform the check job does not run.
      - run: cargo test --locked -p stretto-console
