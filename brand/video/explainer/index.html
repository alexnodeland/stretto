<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stretto: explainer video</title>
<!--
  The explainer video's source: one chapter at a time on a still stage, each a
  diagram that builds as the voice names its parts. Every property of every
  frame is a pure function of time, set by window.__render(t) (main.js);
  render.mjs steps the clock frame by frame and pipes screenshots into ffmpeg.

  logo.js     the wordmark's outline, from brand/logo/
  stage.js    easing, a seeded generator, and the pieces: cards, chips, arrows, code, captions
  film.js     the chapters, from the cold open to the end card, and the teaser
  main.js     the timeline the voice sets, the frame's furniture, and window.__render

  narration.json is the script. Every number on screen is from
  docs/results/claims.md, brand/messaging.md or the files it names.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>
  <div id="scenes" class="layer"></div>
  <div id="over" class="layer"></div>
</div>
<script src="logo.js"></script>
<script src="stage.js"></script>
<script src="film.js"></script>
<script src="main.js"></script>
</body>
</html>
