<title>stretto: explainer video</title>
<!--
  The explainer video's source: one illustrated world, drawn in SVG, and a
  virtual camera that moves across it. Every property of every frame is a pure
  function of time, set by window.__render(t) (main.js); render.mjs steps the
  clock frame by frame and pipes screenshots into ffmpeg.

  engine.js   easing, springs, a seeded RNG, keyframe tracks, the camera's paths
  art.js      the illustrations: agent, customer, server, the stretto lens, cards
  world.js    the world: where each station sits, built from art.js
  scenes.js   the helpers, and the scenes from the open to what stretto cannot touch
  scenes2.js  the scenes from learning a flow to the end card, the teaser, their order
  main.js     timing, the camera, the background layers and window.__render

  Every number on screen is from docs/results/claims.md or
  docs/results/frontier-2026-09-27.md.
-->
